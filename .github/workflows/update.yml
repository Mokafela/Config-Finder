name: Update Subscription

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: "*/15 * * * *" # Every 15 mins
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install xray-knife
        run: |
          LATEST=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest \
            | grep browser_download_url | grep -i 'linux-64\.zip' | head -1 | cut -d '"' -f4)
          wget "$LATEST" -O /tmp/knife.zip
          mkdir -p /tmp/knife
          unzip -o /tmp/knife.zip -d /tmp/knife
          chmod +x /tmp/knife/xray-knife
          sudo mv /tmp/knife/xray-knife /usr/local/bin/

      - name: Restore README files
        run: |
          git checkout HEAD -- README.md README.fa.md

      - name: Run Pipeline
        env:
          CHANNEL_URL: ${{ secrets.CHANNEL_URL }}
        run: python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add split/ subs/subs.json README.md README.fa.md
          git commit -m "Auto-update subscription [skip ci]" || echo "No changes to commit"
          git push
